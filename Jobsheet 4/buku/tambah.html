<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku - Simpus Mini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="flex min-h-screen justify-center items-center p-6">
    <div class="glass w-full max-w-lg p-8 rounded-3xl shadow-2xl">
        <div class="flex items-center space-x-3 mb-6">
            <a href="list.html" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-arrow-left text-lg"></i></a>
            <h2 class="text-xl font-bold text-white">Form Tambah Buku</h2>
        </div>
        <form class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Judul Buku</label>
                <input type="text" placeholder="Masukkan judul..." class="glass-input w-full px-4 py-3 rounded-xl text-sm">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Penulis</label>
                <input type="text" placeholder="Masukkan penulis..." class="glass-input w-full px-4 py-3 rounded-xl text-sm">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Stok</label>
                <input type="number" placeholder="Jumlah stok..." class="glass-input w-full px-4 py-3 rounded-xl text-sm">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition mt-4">Simpan Buku</button>
        </form>
    </div>
</body>
</html>
