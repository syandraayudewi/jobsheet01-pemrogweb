<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Anggota - Simpus Mini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 glass border-r border-slate-800 hidden md:flex flex-col justify-between p-6">
        <div>
            <div class="flex items-center space-x-3 mb-10">
                <div class="bg-indigo-600 p-3 rounded-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-users text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">SIMPUS MINI</h1>
                    <p class="text-xs text-indigo-400">Modul Anggota</p>
                </div>
            </div>
            <nav class="space-y-2">
                <a href="../buku/list.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition">
                    <i class="fa-solid fa-book w-5"></i><span>Data Buku</span>
                </a>
                <a href="list.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-medium">
                    <i class="fa-solid fa-users w-5"></i><span>Data Anggota</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Konten Utama -->
    <main class="flex-1 p-6 md:p-10">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-extrabold text-white">Daftar Anggota Perpustakaan</h2>
                <p class="text-slate-400 text-sm mt-1">Kelola data keanggotaan aktif perpustakaan mini.</p>
            </div>
            <a href="tambah.html" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center space-x-2 transition">
                <i class="fa-solid fa-user-plus"></i><span>Tambah Anggota</span>
            </a>
        </header>

        <div class="glass rounded-2xl p-6">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                        <th class="pb-3 px-4">No</th>
                        <th class="pb-3 px-4">Nama Lengkap</th>
                        <th class="pb-3 px-4">NIM / ID</th>
                        <th class="pb-3 px-4">Program Studi</th>
                        <th class="pb-3 px-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 text-sm">
                    <tr class="hover:bg-white/5 transition">
                        <td class="py-4 px-4">1</td>
                        <td class="py-4 px-4 font-semibold text-indigo-300">Ahmad Fauzi</td>
                        <td class="py-4 px-4 text-slate-400">244107060012</td>
                        <td class="py-4 px-4">D4 Teknik Informatika</td>
                        <td class="py-4 px-4 text-center space-x-2">
                            <button class="p-2 rounded-lg bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30"><i class="fa-solid fa-pen"></i></button>
                            <button class="p-2 rounded-lg bg-rose-500/20 text-rose-400 hover:bg-rose-500/30"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
