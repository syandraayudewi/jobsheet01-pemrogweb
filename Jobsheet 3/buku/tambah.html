<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SIMPUS-Mini | Tambah Buku</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-dark navbar-custom shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                SIMPUS<span>-Mini</span>
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="list.html">Daftar Buku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tambah.html">Tambah Buku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../anggota/list.html">Anggota</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <main class="container my-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7">

                <div class="card card-modern">
                    <div class="card-body p-4 p-md-5">

                        <div class="page-heading mb-4">
                            <h2 class="mb-1">Tambah Buku</h2>
                            <p class="text-secondary mb-0">
                                Masukkan informasi koleksi baru
                            </p>
                        </div>

                        <form>

                            <div class="mb-3">
                                <label for="judul" class="form-label">
                                    Judul Buku
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="judul"
                                    name="judul"
                                    placeholder="Contoh: Laut Bercerita"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="pengarang" class="form-label">
                                    Pengarang
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="pengarang"
                                    name="pengarang"
                                    placeholder="Nama pengarang"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="tahun" class="form-label">
                                    Tahun Terbit
                                </label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="tahun"
                                    name="tahun"
                                    min="1900"
                                    max="2026"
                                    placeholder="2026"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="isbn" class="form-label">
                                    ISBN
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="isbn"
                                    name="isbn"
                                    placeholder="Masukkan ISBN jika ada"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="stok" class="form-label">
                                    Jumlah Stok
                                </label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="stok"
                                    name="stok"
                                    min="0"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="kategori" class="form-label">
                                    Kategori Buku
                                </label>
                                <select
                                    class="form-select"
                                    id="kategori"
                                    name="kategori"
                                >
                                    <option selected disabled>
                                        Pilih kategori
                                    </option>
                                    <option value="fiksi">Fiksi</option>
                                    <option value="non-fiksi">Non-Fiksi</option>
                                    <option value="referensi">Referensi</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-main">
                                    Simpan Buku
                                </button>

                                <a href="list.html" class="btn btn-outline-secondary">
                                    Batal
                                </a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="text-center py-4">
        <p class="mb-0">
            &copy; 2026 SIMPUS-Mini | Jobsheet 3 Bootstrap
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
