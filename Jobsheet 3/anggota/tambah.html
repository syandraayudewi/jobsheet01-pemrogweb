<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SIMPUS-Mini | Tambah Anggota</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-dark navbar-custom shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                SIMPUS<span>-Mini</span>
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../buku/list.html">Daftar Buku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../buku/tambah.html">Tambah Buku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="list.html">Daftar Anggota</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tambah.html">Tambah Anggota</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <main class="container my-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7">

                <div class="card card-modern">
                    <div class="card-body p-4 p-md-5">

                        <div class="page-heading mb-4">
                            <h2 class="mb-1">Tambah Anggota</h2>
                            <p class="text-secondary mb-0">
                                Daftarkan anggota baru perpustakaan
                            </p>
                        </div>

                        <form>

                            <div class="mb-3">
                                <label for="nama" class="form-label">
                                    Nama Lengkap
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nama"
                                    name="nama"
                                    placeholder="Masukkan nama lengkap"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="no_anggota" class="form-label">
                                    Nomor Anggota
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="no_anggota"
                                    name="no_anggota"
                                    placeholder="Contoh: A003"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="alamat" class="form-label">
                                    Alamat
                                </label>
                                <textarea
                                    class="form-control"
                                    id="alamat"
                                    name="alamat"
                                    rows="3"
                                    placeholder="Masukkan alamat lengkap"
                                ></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="no_hp" class="form-label">
                                    Nomor HP
                                </label>
                                <input
                                    type="tel"
                                    class="form-control"
                                    id="no_hp"
                                    name="no_hp"
                                    placeholder="08xxxxxxxxxx"
                                >
                            </div>

                            <div class="mb-4">
                                <label for="email" class="form-label">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="nama@email.com"
                                >
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-main">
                                    Simpan Anggota
                                </button>

                                <a href="list.html" class="btn btn-outline-secondary">
                                    Batal
                                </a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="text-center py-4">
        <p class="mb-0">
            &copy; 2026 SIMPUS-Mini | Jobsheet 3 Bootstrap
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
